name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - run: npm ci

      - run: npm run build -- --base=./

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Remove obsolete Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          deployment_ids=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" \
            --jq '.[].id')

          for deployment_id in $deployment_ids; do
            state=$(gh api \
              "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" \
              --jq '.[0].state')

            case "$state" in
              inactive|failure|error)
                if [ "$state" != "inactive" ]; then
                  gh api --method POST --silent \
                    "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses" \
                    -f state=inactive
                fi
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/deployments/$deployment_id"
                ;;
            esac
          done
